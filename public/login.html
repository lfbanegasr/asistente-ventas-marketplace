<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#172a3a">
  <meta name="robots" content="noindex,nofollow">
  <title>Entrar · Mi mesa de ventas</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/login.js" defer></script>
</head>
<body class="login-body">
  <main class="login-card">
    <div class="login-mark" aria-hidden="true">↗</div>
    <span class="eyebrow">TU ESPACIO PRIVADO</span>
    <h1>Mi mesa de ventas</h1>
    <p>Entra para revisar consultas, entregas, productos y respuestas.</p>
    <form id="login-form">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button id="login-button" class="primary" type="submit">Entrar</button>
    </form>
    <p id="login-error" class="login-error" role="alert" hidden></p>
    <small>Acceso solo para el propietario · La sesión dura 7 días</small>
  </main>
</body>
</html>
